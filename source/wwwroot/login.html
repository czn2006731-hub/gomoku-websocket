<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>棋局 · 登录</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page" data-page="login">
  <main class="auth-shell">
    <section class="auth-intro" aria-labelledby="brand-title">
      <p class="eyebrow">GOMOKU ONLINE</p>
      <h1 id="brand-title">下一手，见分晓。</h1>
      <p class="intro-copy">一个简约的实时五子棋对战空间。登录后进入大厅，匹配对手，开始对局。</p>
      <div class="intro-line" aria-hidden="true"></div>
    </section>

    <section class="auth-card" aria-label="账号入口">
      <div class="tab-list" role="tablist" aria-label="账号操作">
        <button class="tab is-active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">登录</button>
        <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel">注册</button>
      </div>

      <div id="login-panel" class="tab-panel" role="tabpanel" aria-labelledby="login-tab">
        <h2>欢迎回来</h2>
        <p class="muted">使用你的账号继续对局。</p>
        <form id="login-form" class="form-stack" novalidate>
          <label>用户名
            <input name="username" autocomplete="username" minlength="2" maxlength="32" required placeholder="输入用户名">
          </label>
          <label>密码
            <input name="password" type="password" autocomplete="current-password" minlength="3" maxlength="128" required placeholder="输入密码">
          </label>
          <button class="button button-primary" type="submit">进入大厅</button>
        </form>
      </div>

      <div id="register-panel" class="tab-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
        <h2>创建账号</h2>
        <p class="muted">注册完成后即可登录并开始匹配。</p>
        <form id="register-form" class="form-stack" novalidate>
          <label>用户名
            <input name="username" autocomplete="username" minlength="2" maxlength="32" required placeholder="2–32 个字符">
          </label>
          <label>密码
            <input name="password" type="password" autocomplete="new-password" minlength="3" maxlength="128" required placeholder="至少 3 个字符">
          </label>
          <button class="button button-primary" type="submit">创建账号</button>
        </form>
      </div>
      <p id="notice" class="notice" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
